[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bewerbungsagent"
version = "0.1.0"
description = "Findet passende Stellen bei der Bundesagentur fuer Arbeit, schreibt Anschreiben als PDF und verschickt sie erst nach ausdruecklicher Freigabe."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
mcp = ["mcp>=2"]
dev = ["pytest>=8", "aiosmtpd>=1.4"]

[project.scripts]
bewerbungsagent = "bewerbungsagent.__main__:main"

[tool.setuptools.packages.find]
include = ["bewerbungsagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
