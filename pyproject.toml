[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bewerbungsagent"
version = "0.2.0"
description = "Lokaler Bewerbungsagent: findet Stellen, schreibt Anschreiben mit lokalem Modell oder Claude, setzt Lebenslauf, Deckblatt und Mappe als PDF und verschickt erst nach ausdruecklicher Freigabe."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "fpdf2>=2.7",
    "jinja2>=3.1",
    "segno>=1.6",
    "pypdf>=4",
]

[project.optional-dependencies]
mcp = ["mcp>=2"]
dev = ["pytest>=8", "aiosmtpd>=1.4"]

[project.scripts]
bewerbungsagent = "bewerbungsagent.__main__:main"

[tool.setuptools.packages.find]
include = ["bewerbungsagent*"]

[tool.setuptools.package-data]
bewerbungsagent = ["prompts/*.md", "vorlagen/*", "statisch/*", "statisch/schriften/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
