profil: profil/profil.md
anlagen:                       # weitere PDFs, z. B. Zeugnisse. Ein alter Lebenslauf faellt weg, sobald
  - profil/anlagen/Zeugnis.pdf # profil/lebenslauf.yaml angelegt ist und der Lebenslauf erzeugt wird
daten: daten
unterschrift: ""               # Bild der Unterschrift (PNG mit transparentem Hintergrund), optional

suche:
  anzahl: 8
  angebotsart: arbeit          # arbeit | ausbildung | beides
  umkreis_km: 25
  veroeffentlicht_seit_tage: 14
  ohne_zeitarbeit: true
  ohne_minijob: true
  max_treffer_je_begriff: 50
  sperrfrist_tage: 90
  mindest_passung: 30
  mindest_passung_modell: 50

llm:                           # die App kann das in modell.yaml ueberschreiben (Reiter "Modell und Prompts")
  backend: lmstudio            # lmstudio | ollama | openai | claude-cli | anthropic | keins
  modell: ""
  basis_url: ""
  temperatur: 0.6
  timeout_s: 600

mail:
  absender_name: ""
  sachbearbeitung: ""
  kopie_an_mich: true

vault:
  pfad: ""
  ordner: Bewerbungen
  git_commit: true

app:
  port: 8765

dokumente:
  engine: auto                 # auto = Edge/Chrome/Chromium fuer das Layout, sonst einfaches PDF | chromium | fpdf
  browser: ""                  # Pfad zum Browser, leer = automatisch suchen
  anhang: einzeln              # einzeln | mappe (alles in einer PDF mit Deckblatt)
  lebenslauf: true
  projektseite: false
  deckblatt: true

quellen:
  arbeitsagentur: true
  adzuna: false                # Schluessel in .env: ADZUNA_APP_ID, ADZUNA_APP_KEY
  jooble: false                # Schluessel in .env: JOOBLE_KEY
  land: de
  max_treffer: 40
  mail_alarme: false           # Jobalarme von Indeed, StepStone, LinkedIn, XING aus dem Postfach (IMAP_* in .env)
  mail_ordner: INBOX
  mail_tage: 10
